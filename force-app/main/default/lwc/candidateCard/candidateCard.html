<template>
  <!-- Record page: a standard card with collapsible sections, like the related lists next to it. -->
  <template lwc:if={isRecordPage}>
    <lightning-card title="Candidate Card" icon-name="standard:avatar">
      <lightning-button-icon
        slot="actions"
        icon-name="utility:photo"
        alternative-text={photoButtonLabel}
        title={photoButtonLabel}
        onclick={togglePhotoUpload}
        data-id="photo-button"
      ></lightning-button-icon>

      <div class="slds-card__body_inner body">
        <template lwc:if={isLoading}>
          <lightning-spinner
            alternative-text="Loading candidate card"
            size="small"
          ></lightning-spinner>
        </template>

        <template lwc:if={error}>
          <p class="slds-text-color_error" role="alert" data-id="error">
            The candidate card could not be loaded: {error}
          </p>
        </template>

        <template lwc:elseif={view}>
          <div class="top">
            <div class="identity-row">
              <template lwc:if={view.photoUrl}>
                <img
                  class="photo photo_large"
                  src={view.photoUrl}
                  alt={view.photoAlt}
                  data-id="photo"
                />
              </template>
              <template lwc:else>
                <abbr
                  class="photo photo_large initials"
                  title={view.name}
                  data-id="initials"
                  >{view.initials}</abbr
                >
              </template>

              <div class="identity">
                <h2 class="name name_large" data-id="name">{view.name}</h2>
                <p class="subtitle slds-truncate" title={view.subtitle}>
                  {view.subtitle}
                </p>
                <p class={view.yearsClass} data-id="years">
                  <lightning-icon
                    icon-name="utility:clock"
                    size="xx-small"
                    class="years-icon"
                  ></lightning-icon>
                  {view.years}
                </p>
              </div>
            </div>

            <template lwc:if={view.hasFlags}>
              <div class="pills slds-m-top_small" data-id="flags">
                <template for:each={view.flagCounts} for:item="flag">
                  <span key={flag.type} class={flag.pillClass}
                    ><span class="dot"></span>{flag.label}</span
                  >
                </template>
              </div>
            </template>
            <template lwc:else>
              <p class="all-clear slds-m-top_small" data-id="no-flags">
                <lightning-icon
                  icon-name="utility:success"
                  size="xx-small"
                  variant="success"
                ></lightning-icon>
                No missing, inferred or conflicting data
              </p>
            </template>

            <template lwc:if={isPhotoUploadOpen}>
              <div class="slds-m-top_small" data-id="photo-upload">
                <lightning-file-upload
                  label="Profile photo (optional, never used in scoring)"
                  accept={photoFormats}
                  record-id={recordId}
                  onuploadfinished={handlePhotoUploaded}
                ></lightning-file-upload>
              </div>
            </template>
          </div>

          <lightning-accordion
            class="slds-m-top_small sections"
            allow-multiple-sections-open
            active-section-name={openSections}
          >
            <lightning-accordion-section
              name="skills"
              label={view.skillsSectionLabel}
            >
              <div class="pills" data-id="skills">
                <template lwc:if={view.hasSkills}>
                  <template for:each={view.pageSkills} for:item="skill">
                    <span key={skill} class="pill pill_skill">{skill}</span>
                  </template>
                  <template lwc:if={view.hasMoreSkills}>
                    <lightning-button
                      variant="base"
                      label={view.moreSkillsLabel}
                      onclick={toggleAllSkills}
                      class="more-skills"
                      data-id="more-skills"
                    ></lightning-button>
                  </template>
                </template>
                <template lwc:else>
                  <span class="missing">No skills found in CV</span>
                </template>
              </div>
            </lightning-accordion-section>

            <lightning-accordion-section
              name="quality"
              label={view.qualitySectionLabel}
            >
              <template lwc:if={view.hasFlags}>
                <template for:each={view.flagGroups} for:item="group">
                  <div
                    key={group.type}
                    class={group.groupClass}
                    data-id="flag-group"
                  >
                    <p class="flag-group-title">
                      <span class={group.pillClass}
                        ><span class="dot"></span>{group.type}</span
                      >
                      <span class="flag-group-hint">{group.hint}</span>
                    </p>
                    <ul class="flag-list">
                      <template for:each={group.items} for:item="item">
                        <li key={item.key} class="flag-item">
                          <span class="flag-field">{item.field}</span>
                          <span class="flag-detail">{item.detail}</span>
                        </li>
                      </template>
                    </ul>
                  </div>
                </template>
              </template>
              <template lwc:else>
                <p class="missing">
                  Nothing to check: the CV and the record agree.
                </p>
              </template>
            </lightning-accordion-section>
          </lightning-accordion>
        </template>
      </div>
    </lightning-card>
  </template>

  <!-- In a list (job applicants): a compact tile. -->
  <template lwc:else>
    <article class="tile">
      <template lwc:if={view}>
        <div class="identity-row">
          <template lwc:if={view.photoUrl}>
            <img
              class="photo"
              src={view.photoUrl}
              alt={view.photoAlt}
              data-id="photo"
            />
          </template>
          <template lwc:else>
            <abbr class="photo initials" title={view.name} data-id="initials"
              >{view.initials}</abbr
            >
          </template>

          <div class="identity">
            <a
              href="#"
              class="name"
              data-id={view.candidateId}
              onclick={openRecord}
              >{view.name}</a
            >
            <p class="subtitle slds-truncate" title={view.subtitle}>
              {view.subtitle}
            </p>
            <p class={view.yearsClass} data-id="years">{view.years}</p>
          </div>

          <template lwc:if={view.hasApplication}>
            <div class="score-holder" title={view.levelLabel} data-id="score">
              <span class={view.scoreClass} data-id="score-value"
                >{view.scoreLabel}</span
              >
              <p class="score-level">{view.levelLabel}</p>
            </div>
          </template>
        </div>

        <div class="pills slds-m-top_small" data-id="skills">
          <template lwc:if={view.hasSkills}>
            <template for:each={view.shownSkills} for:item="skill">
              <span key={skill} class="pill pill_skill">{skill}</span>
            </template>
            <template lwc:if={view.extraSkillsLabel}>
              <span class="pill pill_more" title={view.extraSkillsTitle}
                >{view.extraSkillsLabel}</span
              >
            </template>
          </template>
          <template lwc:else>
            <span class="missing">No skills found in CV</span>
          </template>
        </div>

        <template lwc:if={view.hasFlags}>
          <div class="pills slds-m-top_x-small" data-id="flags">
            <template for:each={view.flagCounts} for:item="flag">
              <span key={flag.type} class={flag.pillClass}
                ><span class="dot"></span>{flag.label}</span
              >
            </template>
          </div>
        </template>

        <div class="footer">
          <template lwc:if={view.hasApplication}>
            <lightning-button
              variant="base"
              label="View application"
              data-id={view.applicantId}
              onclick={openRecord}
            ></lightning-button>
          </template>
        </div>
      </template>
    </article>
  </template>
</template>
